  - (was still typing)
  - (had something better and deleted it)
  - (got distracted by the snacks)
  - (thought somebody else would handle it)
  - (typed one word and lost their nerve)
  - (was explaining a previous joke)
  - (put the phone face down with confidence)
  - (looked up, looked down, looked up again)
  - (chose violence, then chose nothing)
  - (is still thinking about the last one)
  - (was winning an argument in the group chat)
