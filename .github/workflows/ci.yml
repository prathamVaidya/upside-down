name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2

      - run: bun install --frozen-lockfile

      # Content first: it is the one thing a non-programmer sends a PR against,
      # so it should fail fast and say exactly which line is wrong.
      - name: content
        run: bun run content:check

      - name: typecheck
        run: bun run typecheck

      - name: lint
        run: bun run lint

      - name: unit and render tests
        run: bunx vitest run

      # The integration test: real sockets, real timers, a whole game.
      - name: bot game
        run: |
          bun run build
          UD_FAST=1 UD_ROUNDS=3 bun apps/server/src/index.ts &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/health >/dev/null && break
            sleep 0.5
          done
          bun run bots -- --players 8 --rounds 3 --drop
