name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2

      - run: bun install --frozen-lockfile

      # Content first: it is the one thing a non-programmer sends a PR against,
      # so it should fail fast and say exactly which line is wrong.
      - name: content
        run: bun run content:check

      - name: typecheck
        run: bun run typecheck

      - name: lint
        run: bun run lint

      - name: unit and render tests
        run: bunx vitest run

      # The integration test: real sockets, real timers, a whole game.
      - name: bot game
        run: |
          bun run build
          UD_FAST=1 UD_ROUNDS=3 bun apps/server/src/index.ts &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/health >/dev/null && break
            sleep 0.5
          done
          bun run bots -- --players 8 --rounds 3 --drop

      # The stage and the phone must never serve the same document. They did
      # once — an SPA fallback quietly handed the phone to /stage — and the
      # failure looks like "both URLs show the same thing" rather than an error.
      - name: stage and phone are different surfaces
        run: |
          landing=$(curl -s http://localhost:3000/ | md5sum | cut -d' ' -f1)
          phone=$(curl -s http://localhost:3000/play | md5sum | cut -d' ' -f1)
          stage=$(curl -s http://localhost:3000/stage | md5sum | cut -d' ' -f1)
          deep=$(curl -s http://localhost:3000/r/GRUB | md5sum | cut -d' ' -f1)
          test "$landing" != "$phone" || { echo "::error::/ and /play served the same document"; exit 1; }
          test "$phone" != "$stage" || { echo "::error::/play and /stage served the same document"; exit 1; }
          test "$phone" = "$deep" || { echo "::error::/r/CODE did not serve the phone"; exit 1; }

  # Separate job: Cypress needs its own browser and takes a few minutes, and a
  # failure here should be legible on its own rather than buried under the unit
  # suite. Reuses nothing from `check`, so it can run in parallel.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2

      - run: bun install --frozen-lockfile
      - run: bun run build

      - name: e2e
        uses: cypress-io/github-action@v6
        with:
          install: false
          start: bun run e2e:serve
          wait-on: http://localhost:3100/health
          wait-on-timeout: 60

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
